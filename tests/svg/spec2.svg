<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <style>
    /* 組と名札で色を決める */
    .g { fill: #26a269; }
    .g, .w { stroke: #000; stroke-width: 3; }
    #k { fill: #e5a50a; }
    circle.g { fill: #1c71d8; }
  </style>
  <style><![CDATA[.cd { opacity: 0.75 }]]></style>
  <defs>
    <clipPath id="ob" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.45"/>
    </clipPath>
    <clipPath id="ob2" clipPathUnits="objectBoundingBox">
      <rect x="0" y="0.3" width="1" height="0.4"/>
    </clipPath>
    <clipPath id="us">
      <circle cx="360" cy="200" r="26"/>
    </clipPath>
    <symbol id="sym" viewBox="-50 -50 100 100">
      <circle cx="0" cy="0" r="46" fill="#1a5fb4"/>
      <path d="M-30 0 L0 -30 L30 0 L0 30 Z" fill="#f6d32d"/>
      <rect x="-70" y="35" width="140" height="10" fill="#e01b24"/>
    </symbol>
    <g id="tag">
      <path d="M0 0 L18 0 L18 8 L8 8 L8 18 L0 18 Z" fill="#c061cb"/>
      <circle cx="13" cy="13" r="4" fill="#613583"/>
    </g>
  </defs>

  <!-- 1 行目 -->
  <rect x="1%" y="2%" width="18%" height="25%" fill="#3584e4"/>
  <rect x="2%" y="14%" width="10%" height="14%" fill="#e01b24" fill-opacity="0.6"/>
  <g transform="translate(80 0)" stroke="#000" stroke-width="6" stroke-linecap="round">
    <path d="M10 16 L46 16 L46 44 Z M20 62" fill="#f6d32d"/>
    <path d="M62 62 Z"/>
  </g>
  <svg x="160" y="0" width="80" height="80" viewBox="0 0 40 40">
    <rect x="2" y="2" width="36" height="36" fill="#c64600"/>
    <circle cx="20" cy="20" r="12" fill="#f6d32d"/>
    <rect x="0" y="34" width="60" height="12" fill="#1a5fb4"/>
  </svg>
  <g transform="translate(240 0)">
    <rect x="4" y="4" width="34" height="20" fill="rgb(20% 45% 90%)"/>
    <rect x="42" y="4" width="34" height="20" fill="rgb(240 120 0)"/>
    <rect x="4" y="30" width="34" height="20" fill="rgb(20% 45% 90% / 0.5)"/>
    <rect x="42" y="30" width="34" height="20" fill="rgb(50%,50%,50%)"/>
    <rect x="4" y="56" width="72" height="20" fill="rgb(0.5%, 99.6%, 33.3%)"/>
  </g>
  <g transform="translate(320 0)">
    <rect x="4" y="4" width="34" height="20" class="g"/>
    <rect x="42" y="4" width="34" height="20" id="k"/>
    <rect x="4" y="30" width="34" height="20" class="w" fill="#813d9c"/>
    <circle cx="58" cy="42" r="12" class="g"/>
    <rect x="4" y="56" width="72" height="20" class="g" style="fill:#c061cb"/>
  </g>

  <!-- 2 行目 -->
  <g transform="translate(0 80)">
    <rect x="10" y="6" width="60" height="68" fill="#e01b24" clip-path="url(#ob)"/>
  </g>
  <g transform="translate(80 80)" clip-path="url(#ob2)">
    <rect x="10" y="10" width="26" height="60" fill="#26a269"/>
    <circle cx="54" cy="40" r="22" fill="#e5a50a"/>
  </g>
  <g transform="translate(160 80)" fill="none">
    <circle cx="24" cy="24" r="3" stroke="#000" stroke-width="9"/>
    <circle cx="58" cy="24" r="1.5" stroke="#1c71d8" stroke-width="12"/>
    <ellipse cx="40" cy="58" rx="6" ry="3" stroke="#613583" stroke-width="10"/>
  </g>
  <g transform="translate(240 80)" stroke="#c64600" stroke-width="9" fill="none">
    <path d="M10 16 H70" stroke-dasharray="10 10" stroke-linecap="round"/>
    <path d="M10 40 H70" stroke-dasharray="10 10" stroke-linecap="square"/>
    <path d="M10 64 H70" stroke-dasharray="10 10" stroke-linecap="butt"/>
  </g>
  <g transform="translate(320 80)" fill="none" stroke="#1a5fb4">
    <circle cx="40" cy="40" r="8%"/>
    <line x1="4" y1="4" x2="10%" y2="19%" stroke="#000" stroke-width="2"/>
  </g>

  <!-- 3 行目 -->
  <g transform="translate(0 160)" stroke="#000" stroke-width="14" fill="none">
    <path d="M20 20 Z" stroke-linecap="round"/>
    <path d="M56 20 Z" stroke-linecap="square"/>
    <path d="M20 56 Z" stroke-linecap="butt"/>
    <path d="M56 56 L56 56" stroke-linecap="round" stroke="#e5a50a"/>
  </g>
  <g transform="translate(80 160)">
    <rect x="4" y="4" width="34" height="20" class="g" style="stroke-width:8"/>
    <rect x="42" y="4" width="34" height="20" class="g" style="fill:none;stroke:#e01b24"/>
    <rect x="4" y="30" width="72" height="20" style="fill:#613583"/>
    <rect x="4" y="56" width="72" height="20" class="g"/>
  </g>
  <svg x="160" y="160" width="80" height="80" viewBox="0 0 40 20"
       preserveAspectRatio="xMinYMax meet">
    <rect x="0" y="0" width="40" height="20" fill="#2ec27e"/>
    <circle cx="10" cy="10" r="8" fill="#0f4d33"/>
  </svg>
  <g transform="translate(240 160)">
    <rect x="4" y="4" width="72" height="16" fill="rgb(100%,0%,50%)"/>
    <rect x="4" y="24" width="72" height="16" fill="rgb(33.3%,66.7%,10%)"/>
    <rect x="4" y="44" width="72" height="16" fill="#fa0" fill-opacity="0.35"/>
    <rect x="4" y="64" width="72" height="12" fill="rebeccapurple"/>
  </g>
  <g transform="translate(320 160)" clip-path="url(#us)">
    <use href="#tag" x="10" y="10"/>
    <use href="#tag" x="40" y="40"/>
    <rect x="0" y="60" width="80" height="20" fill="#26a269"/>
  </g>
  <!-- 4 行目 -->
  <use href="#sym" x="6" y="246" width="68" height="68"/>
  <use href="#sym" x="86" y="246" width="68" height="34"/>
  <g transform="translate(160 240)">
    <rect x="0" y="0" width="10mm" height="8mm" fill="#c061cb"/>
    <rect x="0" y="9mm" width="36pt" height="18pt" fill="#26a269"/>
    <rect x="42" y="0" width="2pc" height="1pc" fill="#e5a50a"/>
    <rect x="42" y="20" width="0.3in" height="0.2in" fill="#1c71d8"/>
    <path d="M4 60 H76" stroke="#000" stroke-width="1mm" fill="none"/>
  </g>
  <svg x="240" y="240" width="80" height="80" viewBox="0 0 40 40" overflow="visible">
    <rect x="2" y="2" width="60" height="16" fill="#2ec27e"/>
    <circle cx="20" cy="28" r="10" fill="#613583"/>
  </svg>
  <g transform="translate(320 240)" class="cd">
    <use href="#sym" x="4" y="4" width="34" height="34"/>
    <use href="#sym" x="42" y="42" width="34" height="34" opacity="0.5"/>
  </g>
</svg>
