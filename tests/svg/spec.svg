<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="lin">
      <stop offset="0" stop-color="#e01b24"/>
      <stop offset="0.5" stop-color="#f6d32d"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="linuser" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="60" y2="240"
                    gradientTransform="rotate(30 30 270)">
      <stop offset="0" stop-color="#2ec27e"/>
      <stop offset="1" stop-color="#613583" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="linrep" x1="0" y1="0" x2="0.25" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <linearGradient id="linref" x1="0" y1="0" x2="0.25" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="rad">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e01b24"/>
      <stop offset="1" stop-color="#25091a"/>
    </radialGradient>
    <radialGradient id="radf" cx="0.5" cy="0.5" r="0.5" fx="0.78" fy="0.28"
                    spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </radialGradient>
    <clipPath id="clip">
      <circle cx="40" cy="40" r="30"/>
      <rect x="0" y="34" width="80" height="12"/>
    </clipPath>
    <g id="mark">
      <path d="M0 0 L20 0 L20 8 L8 8 L8 20 L0 20 Z" fill="#c061cb"/>
      <circle cx="16" cy="16" r="4" fill="#613583"/>
    </g>
  </defs>

  <!-- 1 行目: 基本の形 -->
  <g fill="#3584e4">
    <rect x="6" y="6" width="30" height="22"/>
    <rect x="42" y="6" width="32" height="22" rx="10" ry="6" fill="#26a269"/>
    <rect x="6" y="34" width="30" height="22" rx="9" fill="#e5a50a"/>
    <rect x="42" y="34" width="32" height="22" ry="40" fill="#c64600"/>
    <rect x="6" y="62" width="68" height="12" rx="200" ry="200" fill="#813d9c"/>
  </g>
  <g transform="translate(80 0)">
    <circle cx="24" cy="24" r="18" fill="#e01b24"/>
    <ellipse cx="52" cy="26" rx="22" ry="12" fill="#1a5fb4" fill-opacity="0.55"/>
    <ellipse cx="40" cy="58" rx="30" ry="14" fill="none" stroke="#000000" stroke-width="3"/>
  </g>
  <g transform="translate(160 0)">
    <line x1="8" y1="8" x2="70" y2="30" stroke="#000000" stroke-width="4"/>
    <polyline points="8,40 24,20 40,44 56,22 72,46" fill="none" stroke="#e66100"
              stroke-width="3"/>
    <polygon points="10,72 40,52 70,72 40,78" fill="#2ec27e" stroke="#0f4d33" stroke-width="2"/>
  </g>
  <g transform="translate(240 0)" fill="none" stroke-width="3">
    <path d="M8 20 C 8 4, 34 4, 34 20 S 60 36, 60 20" stroke="#1c71d8"/>
    <path d="M8 46 c 0 -14, 26 -14, 26 0 s 26 14, 26 0" stroke="#e01b24"/>
    <path d="M6 74 L20 60 H40 V74 h16 v-8" stroke="#26a269"/>
    <path d="M64 8 l8 0 l0 8 l-8 0 z" stroke="#613583" fill="#dc8add"/>
  </g>
  <g transform="translate(320 0)" fill="none" stroke-width="3">
    <path d="M8 22 Q 24 2, 40 22 T 72 22" stroke="#1a5fb4"/>
    <path d="M8 48 q 16 -20, 32 0 t 32 0" stroke="#c64600"/>
    <path d="M10 60 Q 40 92, 70 60" stroke="#000000" fill="#f9f06b" fill-rule="nonzero"/>
  </g>

  <!-- 2 行目: 円弧・巻き数の見かた・変形 -->
  <g transform="translate(0 80)" fill="none" stroke-width="2.5">
    <path d="M14 30 A 18 12 0 0 0 50 30" stroke="#e01b24"/>
    <path d="M14 30 A 18 12 0 0 1 50 30" stroke="#1c71d8"/>
    <path d="M14 60 A 18 12 0 1 0 50 60" stroke="#26a269"/>
    <path d="M14 60 A 18 12 0 1 1 50 60" stroke="#e5a50a"/>
    <path d="M56 14 a 10 22 40 1 1 18 26" stroke="#613583"/>
    <path d="M56 66 A 4 4 0 0 1 74 66" stroke="#000000"/>
  </g>
  <g transform="translate(80 80)">
    <path d="M40 8 L52 44 L20 22 L60 22 L28 44 Z" fill="#3584e4" stroke="#0b2e5c"
          stroke-width="2"/>
    <path d="M20 52 h40 v20 h-40 z M30 58 h20 v8 h-20 z" fill="#e66100"/>
  </g>
  <g transform="translate(160 80)" fill-rule="evenodd">
    <path d="M40 8 L52 44 L20 22 L60 22 L28 44 Z" fill="#3584e4" stroke="#0b2e5c"
          stroke-width="2"/>
    <path d="M20 52 h40 v20 h-40 z M30 58 h20 v8 h-20 z" fill="#e66100"/>
  </g>
  <g transform="translate(240 80)">
    <rect x="8" y="10" width="24" height="16" fill="#1a5fb4" transform="rotate(-20 20 18)"/>
    <rect x="44" y="10" width="24" height="16" fill="#2ec27e" transform="skewX(-25)"/>
    <rect x="8" y="44" width="24" height="16" fill="#c64600" transform="skewY(18)"/>
    <rect x="46" y="46" width="24" height="16" fill="#813d9c"
          transform="rotate(35) scale(1 0.7)"/>
  </g>
  <g transform="translate(320 80)">
    <rect x="0" y="0" width="30" height="20" fill="#e01b24"
          transform="matrix(1 0.25 -0.35 1 20 12)"/>
    <g transform="translate(10 40) rotate(12)">
      <g transform="scale(1.3 0.8) translate(4 4)">
        <rect x="0" y="0" width="34" height="22" fill="#26a269"/>
        <rect x="6" y="6" width="34" height="22" fill="#f6d32d" fill-opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- 3 行目: 線の端・角・破線 -->
  <g transform="translate(0 160)" stroke="#1c71d8" stroke-width="13" fill="none">
    <path d="M14 14 H62" stroke-linecap="butt"/>
    <path d="M14 36 H62" stroke-linecap="round"/>
    <path d="M14 58 H62" stroke-linecap="square"/>
    <path d="M14 14 H62 M14 36 H62 M14 58 H62" stroke="#ffffff" stroke-width="1"/>
  </g>
  <g transform="translate(80 160)" stroke="#26a269" stroke-width="11" fill="none">
    <path d="M8 26 L24 8 L40 26" stroke-linejoin="miter"/>
    <path d="M40 26 L56 8 L72 26" stroke-linejoin="round"/>
    <path d="M8 70 L24 48 L40 70" stroke-linejoin="bevel"/>
    <path d="M44 70 L60 48 L74 70" stroke-linejoin="miter" stroke-linecap="round"/>
  </g>
  <g transform="translate(160 160)" stroke="#c64600" stroke-width="10" fill="none">
    <path d="M10 30 L40 8 L70 30" stroke-miterlimit="1"/>
    <path d="M10 70 L40 44 L70 70" stroke-miterlimit="10"/>
  </g>
  <g transform="translate(240 160)" stroke="#613583" stroke-width="5" fill="none">
    <path d="M8 14 H72" stroke-dasharray="12 6"/>
    <path d="M8 30 H72" stroke-dasharray="12 6" stroke-dashoffset="6"/>
    <path d="M8 46 H72" stroke-dasharray="9 4 2 4"/>
    <path d="M8 62 H72" stroke-dasharray="7" stroke-dashoffset="-3"/>
    <circle cx="40" cy="72" r="3" stroke-width="9" stroke="#000000"/>
  </g>
  <g transform="translate(320 160)" stroke="#000000" fill="none" stroke-width="12">
    <path d="M20 20 L20 20" stroke-linecap="round"/>
    <path d="M56 20 L56 20" stroke-linecap="square"/>
    <path d="M20 56 L20 56" stroke-linecap="butt"/>
    <path d="M44 48 L68 48 L68 70 L44 70 Z" stroke-width="6" stroke-linejoin="round"
          stroke="#e5a50a"/>
  </g>

  <!-- 4 行目: 色の移り変わり -->
  <g transform="translate(0 240)">
    <rect x="6" y="8" width="68" height="28" fill="url(#lin)"/>
    <circle cx="40" cy="58" r="18" fill="url(#lin)" stroke="#000000" stroke-width="2"/>
  </g>
  <g transform="translate(80 240)">
    <rect x="0" y="0" width="80" height="80" fill="url(#linuser)"/>
  </g>
  <g transform="translate(160 240)">
    <rect x="4" y="6" width="72" height="30" fill="url(#linrep)"/>
    <rect x="4" y="44" width="72" height="30" fill="url(#linref)"/>
  </g>
  <g transform="translate(240 240)">
    <circle cx="40" cy="40" r="34" fill="url(#rad)"/>
  </g>
  <g transform="translate(320 240)">
    <rect x="4" y="4" width="72" height="72" fill="url(#radf)"/>
  </g>

  <!-- 5 行目: 薄さ・切り抜き・使い回し・色の書きかた -->
  <g transform="translate(0 320)">
    <circle cx="28" cy="30" r="20" fill="#e01b24" fill-opacity="0.5"/>
    <circle cx="50" cy="30" r="20" fill="#1c71d8" fill-opacity="0.5"/>
    <rect x="10" y="52" width="60" height="20" fill="none" stroke="#26a269"
          stroke-width="8" stroke-opacity="0.45"/>
  </g>
  <g transform="translate(80 320)" opacity="0.5">
    <circle cx="28" cy="30" r="20" fill="#e01b24"/>
    <circle cx="50" cy="30" r="20" fill="#1c71d8"/>
    <rect x="10" y="52" width="60" height="20" fill="#813d9c"/>
  </g>
  <g transform="translate(160 320)">
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="80" height="80" fill="#e66100"/>
      <path d="M0 80 L80 0 L80 80 Z" fill="#1a5fb4"/>
    </g>
  </g>
  <g transform="translate(240 320)">
    <use href="#mark" x="6" y="6"/>
    <use href="#mark" x="44" y="10" transform="rotate(18 60 26)"/>
    <use href="#mark" x="20" y="46" opacity="0.6"/>
  </g>
  <g transform="translate(320 320)" color="#c01c28">
    <rect x="4" y="4" width="34" height="20" fill="mediumseagreen"/>
    <rect x="42" y="4" width="34" height="20" fill="rgb(20%,45%,90%)"/>
    <rect x="4" y="30" width="34" height="20" fill="#fa0"/>
    <rect x="42" y="30" width="34" height="20" fill="rgb(240,120,0)"/>
    <rect x="4" y="56" width="34" height="20" fill="currentColor"/>
    <rect x="42" y="56" width="34" height="20" style="fill:#613583;stroke:#000;stroke-width:3"/>
  </g>
</svg>
